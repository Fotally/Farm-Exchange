function renderScene(){let out=`<defs><radialGradient id="meadow"><stop stop-color="#e1e6c4"/><stop offset="1" stop-color="#cbd9ad"/></radialGradient><filter id="papergrain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><pattern id="grass" width="83" height="63" patternUnits="userSpaceOnUse"><path d="m14 35-2-4m3 5 2-3m45 16 2-4m-1 5 3-2" stroke="#95ae78" stroke-width="1" opacity=".32"/><circle cx="45" cy="18" r="1.2" fill="#eef0d4"/></pattern></defs><rect width="1440" height="900" fill="url(#meadow)"/><g id="map-content" transform="translate(${state.pan.x} ${state.pan.y}) translate(720 450) scale(${state.zoom}) translate(-720 -450)"><path d="M-80 350Q180 235 350 430T670 475T1050 400T1520 400V950H-80Z" fill="#c1d29f" opacity=".32"/><path d="M-70 410Q160 340 330 480T630 520T1000 500T1490 510" stroke="#edf0d14d" fill="none" stroke-width="3"/><path d="M1030 150Q1200 240 1130 350T1260 570T1420 740" stroke="#bdd1ac" fill="none" stroke-width="90" opacity=".45"/><path d="M1260 200Q1150 320 1240 443T1510 600" stroke="#a9c8b2" stroke-width="43" fill="none"/><path d="M1265 195Q1155 320 1246 441T1513 595" stroke="#c0d8c2" stroke-width="34" fill="none"/><path d="m1235 360 47 4m-31 6 42 4m-26 112 43 9" stroke="#e5edda" stroke-width="2" opacity=".8"/><rect width="1440" height="900" fill="url(#grass)"/>`;
// 只绘制主地图中心附近的 26×26 基础格，原型不模拟完整 384×384 世界。
for(let x=0;x<26;x++)for(let y=0;y<26;y++)out+=`<polygon class="map-cell" data-cell="${x},${y}" points="${polygon(x,y)}"/>`;
for(let n=0;n<110;n++){let x=(n*137+71)%1440,y=(n*89+140)%900;if(x>400&&x<960&&y>310&&y<730)continue;out+=`<circle cx="${x}" cy="${y}" r="${n%3===0?2:1}" fill="${n%3===0?'#f3edc3':'#97ae75'}" opacity=".65"/>`;}
// 装饰林木，不代表新增可操作设施。
const trees=[[313,290,.9,0],[351,313,1.1,1],[288,346,1.2,2],[374,357,.82,0],[254,390,.8,1],[342,400,1,0],[1090,297,1.15,2],[1044,319,.9,0],[1126,338,.95,1],[1059,377,1.15,0],[1160,401,.85,2],[1098,435,1.1,1],[350,662,1.1,0],[312,708,1.3,2],[384,712,.9,1],[444,745,1,0],[1009,665,1,1],[1072,693,1.3,0],[1026,735,1.1,2],[936,769,.95,0],[1094,763,.85,1]];
for(const t of trees.filter(t=>t[1]<460))out+=tree(...t);

for(const f of ordered){let [cx,cy]=xy(f.x,f.y);out+=`<g class="facility" data-facility="${f.id}" role="button" tabindex="0" aria-label="${f.kind==='farm'?crops[f.crop].name+'农田':f.kind==='road'?'道路':crops[f.crop].building}"><title>点击查看${f.kind==='farm'?'农田':f.kind==='road'?'道路':'加工场地'}详情</title>`;

document.addEventListener('keydown',event=>{if(event.key==='Escape'){if(state.placement)cancelPlacement();else if(state.window)closeWindow();else{$('#detail').hidden=true;state.selected=null;renderScene();}return;}if(event.target.closest('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft'){event.preventDefault();cycle(-1);}if(event.key==='ArrowRight'){event.preventDefault();cycle(1);}if((event.key==='Enter'||event.key===' ')&&event.target.dataset.facility){event.preventDefault();state.selected=+event.target.dataset.facility;refresh();}});
let mapDrag=null;
$('#landscape').addEventListener('pointerdown',event=>{if(event.button!==0)return;mapDrag={x:event.clientX,y:event.clientY,pan:{...state.pan},moved:false};$('#landscape').setPointerCapture(event.pointerId);});
$('#landscape').addEventListener('pointermove',event=>{if(mapDrag){let dx=event.clientX-mapDrag.x,dy=event.clientY-mapDrag.y;if(Math.hypot(dx,dy)>5)mapDrag.moved=true;if(mapDrag.moved){const scale=Math.max(innerWidth/1440,innerHeight/900);state.pan={x:mapDrag.pan.x+dx/scale,y:mapDrag.pan.y+dy/scale};renderScene();return;}}preview(event);});
$('#landscape').addEventListener('pointerup',event=>{if(!mapDrag)return;const moved=mapDrag.moved;mapDrag=null;if(moved)return;const {x,y}=mapPoint(event);if(state.placement){buildAt(x,y);return;}let id=state.facilities.findIndex(f=>{const size=f.kind==='road'?1:3;return x>=f.x&&x<f.x+size&&y>=f.y&&y<f.y+size;});if(id<0){const element=document.elementFromPoint(event.clientX,event.clientY);if(element?.closest('[data-facility]'))id=+element.closest('[data-facility]').dataset.facility;}if(id>=0){state.selected=id;refresh();}});
$('#landscape').addEventListener('pointercancel',()=>mapDrag=null);
$('#landscape').addEventListener('pointerleave',()=>{if($('#placement-preview'))$('#placement-preview').innerHTML='';});
$('#landscape').addEventListener('wheel',event=>{event.preventDefault();state.zoom=Math.min(1.65,Math.max(.75,state.zoom+(event.deltaY<0?.05:-.05)));refresh();},{passive:false});
document.addEventListener('contextmenu',event=>{if(state.placement){event.preventDefault();cancelPlacement();}});
// UI 遮挡时清除候选，与正式界面的输入层级一致。
document.addEventListener('pointermove',event=>{if(state.placement&&!event.target.closest('#landscape')&&$('#placement-preview'))$('#placement-preview').innerHTML='';});
function bindDrag(panel,handleSelector){const handle=panel.querySelector(handleSelector);if(!handle)return;handle.onpointerdown=event=>{if(event.button!==0||event.target.closest('button'))return;const rect=panel.getBoundingClientRect();let dx=event.clientX-rect.left,dy=event.clientY-rect.top;panel.style.transform='none';panel.style.left=rect.left+'px';panel.style.top=rect.top+'px';panel.style.right='auto';handle.setPointerCapture(event.pointerId);handle.onpointermove=e=>{panel.style.left=Math.max(8,Math.min(innerWidth-panel.offsetWidth-8,e.clientX-dx))+'px';panel.style.top=Math.max(8,Math.min(innerHeight-panel.offsetHeight-55,e.clientY-dy))+'px';};handle.onpointerup=handle.onpointercancel=()=>handle.onpointermove=null;};}
window.addEventListener('resize',()=>{$('#detail').style.left='';$('#detail').style.top='';$('#detail').style.right='';$('#window').style.left='';$('#window').style.top='';$('#window').style.transform='';});
setVariant(new URLSearchParams(location.search).get('variant')||'B');
</script>
</body>
