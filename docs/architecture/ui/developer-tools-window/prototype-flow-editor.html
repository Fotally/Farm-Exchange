<style>

.group-tabs{display:flex;gap:8px;flex:none}.group-tabs button{font-size:14px;padding:6px 13px}.group-tabs .active{background:var(--green);border-color:var(--green);color:var(--cream)}.layout-a .fields{gap:10px 18px}.layout-a .field{gap:5px}.layout-a .group h3{display:none}
.layout-b{height:100%;display:flex;flex-direction:column;gap:16px}.layout-b .catalog{height:123px;flex:none;display:grid;grid-template-columns:245px 1fr;grid-template-rows:39px 1fr;gap:10px 17px}.layout-b .catalog-heading{display:none}.layout-b .search{grid-column:1}.layout-b .categories{grid-column:1;grid-row:2;align-content:start}.layout-b .flows{grid-column:2;grid-row:1/3;flex-direction:row;align-items:stretch}.layout-b .flow{width:300px}.layout-b .workspace{border-left:0;border-top:1px solid #c4af7d;padding:14px 0 0;flex:1}.layout-b .intro{display:none}.layout-b .config-groups{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:23px}.layout-b .fields{grid-template-columns:1fr}.layout-b .array-row{grid-template-columns:1fr;gap:9px}.layout-b .game-date input{width:60px}
.layout-c{height:100%;display:flex;flex-direction:column;gap:18px}.steps{display:flex;gap:13px;flex:none}.steps button{flex:1;text-align:left}.steps .active{background:var(--green);color:var(--cream);border-color:var(--green)}.step-content{flex:1;min-height:0;display:flex;flex-direction:column}.wizard-catalog{display:grid;grid-template-columns:285px 1fr;grid-template-rows:39px 1fr;gap:18px 28px;min-height:0;flex:1}.wizard-catalog .catalog-heading{display:none}.wizard-catalog .search{grid-column:1;grid-row:1}.wizard-catalog .categories{grid-column:1;grid-row:2;align-content:start}.wizard-catalog .flows{grid-column:2;grid-row:1/3;display:grid;grid-template-columns:1fr 1fr;align-content:start}.wizard-catalog .flow{min-height:140px}.layout-c .workspace{border-left:0;padding-left:0;flex:1}.layout-c .config-groups{display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:25px}.layout-c .fields{grid-template-columns:1fr}.layout-c .array-row{grid-template-columns:1fr}.layout-c .game-date input{width:62px}.wizard-next{display:flex;justify-content:flex-end;border-top:1px solid #bba573;padding-top:14px;margin-top:14px}
.prototype-switcher{position:absolute;left:50%;bottom:19px;transform:translateX(-50%);background:#342e23;color:#fff1cb;padding:10px 15px;display:flex;align-items:center;gap:14px;box-shadow:4px 4px 0 #6d7545;font-size:14px}.prototype-switcher button{background:#514735;border:1px solid #a58c5a;color:#fff1cb;box-shadow:none;font-size:13px;padding:6px 10px}.prototype-switcher .label{min-width:166px;text-align:center}.prototype-switcher label{display:flex;align-items:center;gap:6px;white-space:nowrap}.prototype-switcher input{width:17px;height:17px}.prototype-info{position:absolute;right:36px;bottom:118px;max-width:265px;background:#f4e8cb;border:2px solid #a58c5a;padding:9px 12px;font-size:12px;color:var(--muted);line-height:1.6}.state-line{font-size:12px;color:var(--muted);margin-top:3px}.fixture-banner{padding:8px 11px;background:#e3d4a9;font-size:13px}
.flow{position:relative;border:2px solid var(--line);background:#f0dfb4;padding:0;box-shadow:inset 0 0 0 1px #fff1d0}.flow.selected{box-shadow:inset 4px 0 0 #718043}.flow-select{display:block;width:100%;height:100%;text-align:left;border:0;background:transparent;box-shadow:none;padding:14px 15px 43px}.flow-select:hover{background:#f8ebc9}.flow.selected .flow-select:hover{background:#e9e3bf}.flow-delete{position:absolute;right:9px;bottom:8px;width:29px;height:29px;padding:5px;display:flex;align-items:center;justify-content:center;background:#f8edcf}.flow-delete svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.wizard-catalog .flows{grid-template-columns:repeat(2,minmax(0,1fr))}.wizard-catalog .flow{min-height:112px}.wizard-catalog .flow-select{padding:11px 13px 38px}.wizard-catalog .flow b{font-size:15px;margin-bottom:6px}.wizard-catalog .flow span{font-size:12px;line-height:1.55}.flows .empty{grid-column:1/-1}.delete-dialog{width:520px;padding:25px;background:var(--paper);color:var(--ink);border:5px solid var(--wood);outline:1px solid #d9c294;outline-offset:-9px;box-shadow:7px 7px 0 #72603e}.delete-dialog::backdrop{background:#342e2366}.delete-dialog h2{font-size:20px;font-weight:500;margin-bottom:15px}.delete-dialog p{font-size:14px;line-height:1.8}.delete-dialog .buttons{display:flex;justify-content:flex-end;gap:12px;margin-top:22px}
.profile-delete{width:35px;height:35px;flex:none;padding:7px;display:flex;align-items:center;justify-content:center}.profile-delete svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>

<body>
<div id="scene">
  <div class="date-card">
    <span class="leaf">♧</span><div class="date-text"><b>春 · 第 1 年 · 1 月 · 1 日</b><small id="calendar-note">自动照料 · 成熟自动入库</small></div>
    <div class="divider"></div><button id="rate" title="点击切换为2×">1×</button><button class="pause" id="pause" title="暂停经营">Ⅱ</button>
  </div>
  <section class="window">
    <header class="header"><div><small>FARM EXCHANGE</small><h1>开发测试 · 流程与配置</h1></div><div class="right"><span class="badge">开发工具</span><button class="close" title="原型不关闭，使用布局切换比较">×</button></div></header>
    <main class="body" id="main"></main>
  </section>
  <div class="prototype-info">交互原型 · 非真实经营<br>参数、另存为、覆盖与执行反馈均仅在内存中演示，刷新页面重置。</div>
  <nav class="prototype-switcher"><button id="previous">←</button><span class="label" id="variant-label"></span><button id="next">→</button><label><input type="checkbox" id="density">目录容量示意</label><label><input type="checkbox" id="fixture">字段兼容示意</label></nav>
</div>
<dialog class="delete-dialog" id="delete-dialog" aria-labelledby="delete-heading" aria-describedby="delete-description">
  <h2 id="delete-heading"></h2>
  <p id="delete-description"></p>
  <p class="muted">原型仅演示内存变化，不删除文件。</p>
  <div class="buttons"><button id="delete-cancel" autofocus>取消</button><button id="delete-confirm" class="primary">确认删除</button></div>
</dialog>
<script>
const clone=value=>JSON.parse(JSON.stringify(value));
const variants=['A','B','C'];
const names={A:'分栏工作台',B:'页签目录',C:'分步操作（已选）'};
let variant=new URLSearchParams(location.search).get('variant')||'C';
if(!variants.includes(variant))variant='C';
let category='全部',search='',dense=false,fixture=false,step=1,rate=1,paused=false,running=false,dirty=false,activeGroup=1,timer;
let feedback='选择已有配置，或编辑后另存为。',result='尚未运行。';
const realFlow={id:'buy-process-sell',name:'买入 → 加工 → 委托卖出',category:'生产与交易',description:'买入原料，经指定场地加工，再以一次委托卖出，核对资源与成交。'};
const demoNames={'农田生产':['播种与供水','季末作物处理','连续复种检查'],'加工场地':['原料领取与底线','连续批次加工','多场地原料竞争'],'交易与委托':['一次限价成交','卖单冻结与撤销','持续交易策略'],'工人与地图':['工人移动与任务','场地选择与拆除','远距离工人分配'],'日历与计划':['年度表执行','冬春日期环绕','报价日期推进']};
const deletedFlowIds=new Set();
function flowList(){const flows=dense?[realFlow,...Object.entries(demoNames).flatMap(([group,names])=>names.map((name,index)=>({id:group+index,name,category:group,description:'目录容量示意，用于查看分类、搜索与长列表布局。',sample:true})))]:[realFlow];return flows.filter(flow=>!deletedFlowIds.has(flow.id));}
let selectedFlow=realFlow;
const profiles=[
 {name:'小麦基础',revision:1,readOnly:true,values:{caseId:'小麦基础',run:{target:'independent',seed:12345},parameters:{rawCommodity:'Wheat.Raw',quantity:1,processorAnchor:{x:0,y:0},processingWaitLimitTicks:1800,orderWaitLimitTicks:10},execution:{timePlan:[{endDate:'01-04-01',rate:2}]}}},
 {name:'萝卜三份',revision:1,readOnly:true,values:{caseId:'萝卜三份',run:{target:'independent',seed:12345},parameters:{rawCommodity:'Radish.Raw',quantity:3,processorAnchor:{x:0,y:0},processingWaitLimitTicks:79,orderWaitLimitTicks:1},execution:{timePlan:[{endDate:'01-01-02',rate:2},{endDate:'01-02-01',rate:20}]}}},
 {name:'当前局萝卜',revision:1,readOnly:true,values:{caseId:'当前局萝卜',run:{target:'current'},parameters:{rawCommodity:'Radish.Raw',quantity:1,processorAnchor:{x:0,y:0},processingWaitLimitTicks:27,orderWaitLimitTicks:1},execution:{timePlan:[{endDate:'01-02-01',rate:1}]}}}
];
let profileIndex=1,values=clone(profiles[profileIndex].values);
// 仅扫描描述来生成表单：目录和表单不按某个流程字段逐项写控件。
const schema=[
 {title:'基本配置',fields:[
  {path:'caseId',label:'配置名称',kind:'text'},
  {path:'run.target',label:'运行对象',kind:'choice',options:[['independent','独立数据局'],['current','当前游戏']]},
  {path:'run.seed',label:'随机种子',kind:'integer',min:-2147483648,max:2147483647,visible:['run.target','independent'],help:'独立局使用固定种子；不会替换当前地图。'}]},
 {title:'生产参数',fields:[
  {path:'parameters.rawCommodity',label:'原料',kind:'choice',options:[['Wheat.Raw','小麦'],['Corn.Raw','玉米'],['Rice.Raw','水稻'],['Potato.Raw','马铃薯'],['Sunflower.Raw','向日葵'],['Sugarcane.Raw','甘蔗'],['Radish.Raw','萝卜']]},
  {path:'parameters.quantity',label:'买入数量（份）',kind:'integer',min:1,max:2147483647},
  {path:'parameters.processorAnchor',label:'加工场地锚点',kind:'object',fields:[{path:'x',label:'X',kind:'integer',min:-2147483648,max:2147483647},{path:'y',label:'Y',kind:'integer',min:-2147483648,max:2147483647}]},
  {path:'parameters.processingWaitLimitTicks',label:'加工等待上限（经营秒）',kind:'integer',min:1,max:4294967295},
  {path:'parameters.orderWaitLimitTicks',label:'订单等待上限（经营秒）',kind:'integer',min:1,max:4294967295}]},
 {title:'时间安排',fields:[
  {path:'execution.timePlan',label:'时间段 · 按顺序执行',kind:'array',itemDefault:{endDate:'01-02-02',rate:2},fields:[{path:'endDate',label:'截止游戏日期',kind:'date'},{path:'rate',label:'经营倍率',kind:'rate'}],help:'日期严格递增；暂停不消耗等待预算。'}]}
];
const fixtureSchema=[{title:'字段兼容示意 · 不是新增可运行流程',fields:[{path:'caption',label:'检查名称',kind:'text'},{path:'enabled',label:'启用检查',kind:'boolean'},{path:'limit',label:'数量上限',kind:'integer',min:1,max:999},{path:'group',label:'检查对象',kind:'object',fields:[{path:'name',label:'名称',kind:'text'},{path:'active',label:'包含此对象',kind:'boolean'}]}]}];
let fixtureValues={caption:'字段结构兼容',enabled:true,limit:12,group:{name:'示意对象',active:false}};
function get(path,obj=values){return path.split('.').reduce((value,key)=>value?.[key],obj);}
function set(path,value,obj=values){const keys=path.split('.'),last=keys.pop();let part=obj;for(const key of keys)part=part[key];part[last]=value;}
function el(tag,attributes={},text){const node=document.createElement(tag);for(const[key,value]of Object.entries(attributes)){if(key==='class')node.className=value;else if(key.startsWith('on'))node.addEventListener(key.slice(2),value);else node.setAttribute(key,value);}if(text!==undefined)node.textContent=text;return node;}
function button(text,action,className=''){return el('button',{class:className,onclick:action},text);}
function trashButton(label,action){const control=button('',action,'flow-delete');control.title=label;control.setAttribute('aria-label',label);control.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 10v7M14 10v7"/></svg>';return control;}
function updateState(){document.querySelectorAll('.dirty').forEach(node=>node.textContent=dirty?'未保存修改':(profiles[profileIndex]?.readOnly?'内置只读':'已保存')+' · 修订'+(profiles[profileIndex]?.revision??'—'));document.querySelectorAll('.feedback').forEach(node=>{node.textContent=feedback;node.classList.toggle('error',feedback.includes('请')||feedback.includes('错误'));});document.querySelectorAll('.state-line').forEach(node=>node.textContent=values?'草稿：'+(values.caseId||'未命名')+' · '+values.parameters.quantity+'份 · '+values.execution.timePlan.length+'个时间段':'尚未选择配置');document.querySelectorAll('[data-visible]').forEach(node=>{const pair=JSON.parse(node.dataset.visible);node.hidden=get(pair[0])!==pair[1];});}
function change(path,value){set(path,value,fixture?fixtureValues:values);dirty=true;feedback='草稿已修改；保存后再运行。';updateState();}
function renderField(def,prefix='',source=fixture?fixtureValues:values){const path=prefix?prefix+'.'+def.path:def.path,value=get(path,source);const field=el('div',{class:'field'+(def.kind==='array'?' wide':'')});if(def.visible)field.dataset.visible=JSON.stringify(def.visible);field.append(el('label',{},def.label));
 if(['text','integer'].includes(def.kind)){const input=el('input',{type:def.kind==='text'?'text':'number',value:value??'',...(def.kind==='integer'?{min:def.min,max:def.max,step:1}:{}),oninput:e=>change(path,def.kind==='text'?e.target.value:e.target.value===''?null:Number(e.target.value))});field.append(input);}
 else if(def.kind==='boolean'){field.classList.add('check-field');const input=el('input',{type:'checkbox',onchange:e=>change(path,e.target.checked)});input.checked=!!value;field.append(input);}
 else if(def.kind==='choice'){const input=el('select',{onchange:e=>{change(path,e.target.value);}});for(const[v,label]of def.options)input.append(el('option',{value:v},label));input.value=value;field.append(input);}
 else if(def.kind==='rate'){const row=el('div',{class:'object-fields'}),input=el('input',{type:'number',value,step:.5,min:.5,oninput:e=>change(path,Number(e.target.value))});row.append(input);field.append(row);}
 else if(def.kind==='date'){const row=el('div',{class:'game-date'}),parts=(value||'--').split('-');['年','月','日'].forEach((label,index)=>{const input=el('input',{type:'number',min:1,max:index===0?99:index===1?12:28,value:Number(parts[index])||'',step:1,oninput:e=>{parts[index]=e.target.value;change(path,parts.map(part=>String(part).padStart(2,'0')).join('-'));}});row.append(input,el('span',{},label));});field.append(row);}
 else if(def.kind==='object'){const row=el('div',{class:'object-fields'});for(const child of def.fields)row.append(renderField(child,path,source));field.append(row);}
 else if(def.kind==='array'){const list=el('div',{class:'array-items'});function rows(){list.replaceChildren();get(path,source).forEach((item,index)=>{const row=el('div',{class:'array-row'});for(const child of def.fields)row.append(renderField(child,path+'.'+index,source));row.append(button('删除此段',()=>{get(path,source).splice(index,1);dirty=true;rows();updateState();}));list.append(row);});}rows();field.append(list,button('＋ 添加时间段',()=>{get(path,source).push(clone(def.itemDefault));dirty=true;rows();updateState();},'array-add'));}
 if(def.help)field.append(el('small',{},def.help));return field;}
function form(){const groups=el('div',{class:'config-groups'});const defined=fixture?fixtureSchema:schema;for(const[groupIndex,group]of defined.entries()){const section=el('section',{class:'group'}),fields=el('div',{class:'fields'});section.hidden=variant==='A'&&groupIndex!==Math.min(activeGroup,defined.length-1);section.append(el('h3',{},group.title));for(const def of group.fields)fields.append(renderField(def));section.append(fields);groups.append(section);}return groups;}
function pickProfile(index){profileIndex=index;values=clone(profiles[index].values);dirty=false;feedback='已加载配置草稿。';render();}
function catalog(horizontal=false){const panel=el('aside',{class:'catalog'});panel.append(el('h2',{class:'catalog-heading'},'流程目录'));const input=el('input',{class:'search',placeholder:'搜索流程名称或简介',value:search,oninput:e=>{search=e.target.value;renderFlows();}});panel.append(input);const categories=el('div',{class:'categories'});for(const group of['全部',...new Set(flowList().map(flow=>flow.category))])categories.append(button(group,()=>{category=group;render();},group===category?'active':''));panel.append(categories,el('div',{class:'flows'}));return panel;}
function renderFlows(){document.querySelectorAll('.flows').forEach(list=>{list.replaceChildren();const flows=flowList().filter(flow=>(category==='全部'||category===flow.category)&&(flow.name+' '+flow.description).includes(search));for(const flow of flows){const card=el('div',{class:'flow'+(selectedFlow?.id===flow.id?' selected':'')}),select=button('',()=>{if(running)return;selectedFlow=flow;feedback=flow.sample?'目录容量示意，不能作为真实流程运行。':'选择配置并可视化编辑。';render();},'flow-select');select.append(el('b',{},flow.name),el('span',{},flow.description));select.setAttribute('aria-pressed',String(selectedFlow?.id===flow.id));const remove=trashButton('删除流程「'+flow.name+'」',event=>{event.stopPropagation();requestDelete(flow);});select.disabled=remove.disabled=running;card.append(select,remove);list.append(card);}if(!flows.length)list.append(el('div',{class:'empty'},flowList().length?'没有匹配的流程':'目录为空；刷新页面可恢复原型示例。'));});}
const deleteDialog=document.getElementById('delete-dialog');
let pendingDelete=null;
function requestDelete(flow){if(running||deletedFlowIds.has(flow.id))return;openDelete('flow',flow,'确认删除流程「'+flow.name+'」？','从目录移除此流程，并删除其所有可写配置；内置只读示例与历史报告保留。');}
function requestDeleteProfile(){const profile=profiles[profileIndex];if(running||!profile||profile.readOnly)return;openDelete('profile',profile,'确认删除配置「'+profile.name+'」？','删除此配置文件，已有报告保留。');}
function openDelete(kind,item,heading,description){pendingDelete={kind,item};document.getElementById('delete-heading').textContent=heading;document.getElementById('delete-description').textContent=description;deleteDialog.showModal();}
document.getElementById('delete-cancel').onclick=()=>deleteDialog.close();
deleteDialog.addEventListener('close',()=>pendingDelete=null);
document.getElementById('delete-confirm').onclick=()=>{if(!pendingDelete||running)return;const {kind,item}=pendingDelete;if(kind==='flow'){deletedFlowIds.add(item.id);if(item.id===realFlow.id){for(let index=profiles.length-1;index>=0;index--)if(!profiles[index].readOnly)profiles.splice(index,1);resetProfile();}if(selectedFlow?.id===item.id){selectedFlow=null;step=1;result='尚未运行。';}if(category!=='全部'&&!flowList().some(flow=>flow.category===category))category='全部';feedback='已从原型目录移除「'+item.name+'」及其可写配置；内置示例与历史报告保留。';}else{const index=profiles.indexOf(item);if(index<0||item.readOnly)return;profiles.splice(index,1);resetProfile();feedback='已在内存中删除配置「'+item.name+'」；已有报告保留。';}deleteDialog.close();render();};
function resetProfile(){profileIndex=profiles.length?0:-1;values=profileIndex>=0?clone(profiles[profileIndex].values):null;dirty=false;}
function validate(){if(!values.caseId.trim())return'请填写配置名称。';if(values.run.target==='independent'&&!Number.isInteger(values.run.seed))return'请填写独立局的整数种子。';for(const name of['quantity','processingWaitLimitTicks','orderWaitLimitTicks'])if(!Number.isInteger(values.parameters[name])||values.parameters[name]<1)return'请填写合法的数量与等待预算。';if(!values.execution.timePlan.length)return'请至少添加一个时间段。';let previous='';for(const item of values.execution.timePlan){if(!/^\d{2}-\d{2}-\d{2}$/.test(item.endDate))return'请填写完整游戏日期。';const[y,m,d]=item.endDate.split('-').map(Number);if(y<1||m<1||m>12||d<1||d>28||item.endDate<=previous)return'请使用合法且严格递增的游戏日期。';if(!(item.rate===.5||Number.isFinite(item.rate)&&item.rate>0&&Number.isInteger(item.rate)))return'请使用0.5、1、2或正整数倍率。';previous=item.endDate;}return'';}
function savedValues(){const saved=clone(values);if(saved.run.target==='current')delete saved.run.seed;return saved;}
function save(copy){if(running||!selectedFlow||!profiles[profileIndex])return;if(fixture||selectedFlow.sample){feedback='兼容或目录示意不保存为真实流程配置。';updateState();return;}if(!copy&&profiles[profileIndex].readOnly){feedback='内置示例只读，请另存为自己的配置。';updateState();return;}const error=validate();if(error){feedback=error;updateState();return;}if(copy){const name=prompt('新配置名称（另存为会保留原配置）',values.caseId+'（副本）');if(!name?.trim())return;values.caseId=name.trim();profiles.push({name:values.caseId,revision:1,readOnly:false,values:savedValues()});profileIndex=profiles.length-1;feedback='已在内存中另存为；原配置保持。';}else{const selected=profiles[profileIndex];selected.revision++;selected.name=values.caseId;selected.values=savedValues();feedback='已在内存中覆盖，修订递增；已有报告保留原摘要。';}dirty=false;render();}
function run(){if(running||!selectedFlow||!profiles[profileIndex])return;if(fixture||selectedFlow.sample){feedback='当前为兼容或目录示意，不是真实可运行流程。';updateState();return;}if(profiles[profileIndex].readOnly){feedback='请先另存为自己的配置，再运行。';updateState();return;}if(dirty){feedback='请先另存为或覆盖保存，再运行已保存配置。';updateState();return;}const error=validate();if(error){feedback=error;updateState();return;}running=true;result='运行示意：买入 → 加工 → 一次委托卖出。';feedback='演示进行中，不推进真实经营。';if(variant==='C')step=3;render();timer=setTimeout(()=>{running=false;result='示意完成 · 真实检查与报告仍由Godot固定流程负责。';feedback='原型未写入文件，也未生成真实报告。';render();},1700);}
function abort(reason='用户中止运行示意'){clearTimeout(timer);running=false;result=reason;feedback='演示已中止；没有真实经营操作。';render();}
function workspace(){const panel=el('section',{class:'workspace'});if(!selectedFlow){panel.append(el('div',{class:'empty'},'请先选择目录中的流程。'));return panel;}const intro=el('div',{class:'intro'});intro.append(el('h2',{},selectedFlow.name),el('p',{class:'description'},selectedFlow.description));panel.append(intro);if(selectedFlow.sample){panel.append(el('div',{class:'result'},'目录容量示意：此条目没有已实现的流程与配置，仅用于检验分类和搜索。'));return panel;}if(!profiles.length){panel.append(el('div',{class:'empty'},'此流程暂无配置。'));return panel;}const row=el('div',{class:'profile-row'}),select=el('select',{onchange:e=>pickProfile(Number(e.target.value))});profiles.forEach((profile,index)=>select.append(el('option',{value:index},profile.name+' · 修订'+profile.revision)));select.value=profileIndex;const deleteProfile=trashButton('删除配置「'+profiles[profileIndex].name+'」',requestDeleteProfile);deleteProfile.className='profile-delete';deleteProfile.disabled=running||profiles[profileIndex].readOnly;if(profiles[profileIndex].readOnly)deleteProfile.title='内置只读示例不能删除';row.append(el('label',{},'配置'),select,deleteProfile,el('span',{class:'dirty'}));panel.append(row);if(fixture)panel.append(el('div',{class:'fixture-banner'},'字段兼容示意：同一生成器显示文本、布尔、整数与嵌套对象。'));if(variant==='A'){const tabs=el('div',{class:'group-tabs'});(fixture?fixtureSchema:schema).forEach((group,index)=>tabs.append(button(group.title,()=>{activeGroup=index;render();},index===Math.min(activeGroup,(fixture?fixtureSchema:schema).length-1)?'active':'')));panel.append(tabs);}const scroll=el('div',{class:'form-scroll'});scroll.append(form());panel.append(scroll);const feedbackNode=el('div',{class:'feedback'});panel.append(feedbackNode,el('div',{class:'state-line'}));const actions=el('div',{class:'actions'}),saveButtons=el('div',{class:'buttons'}),runButtons=el('div',{class:'buttons'});saveButtons.append(button('另存为…',()=>save(true)),button('覆盖保存',()=>save(false)));saveButtons.lastChild.disabled=profiles[profileIndex].readOnly||fixture;saveButtons.firstChild.disabled=fixture;runButtons.append(button('运行示意',run,'primary'),button('中止',()=>abort()));actions.append(saveButtons,runButtons);panel.append(actions,el('p',{class:'save-note'},profiles[profileIndex].readOnly?'内置示例只读：另存为自己的配置后，可以覆盖保存和运行。':'覆盖会更新此配置，已有报告保留原摘要。'));runButtons.firstChild.disabled=profiles[profileIndex].readOnly||fixture;const rates=el('div',{class:'rate-tools'});rates.append(el('span',{},'当前局倍率'));for(const value of[.5,1,2,5,10,20])rates.append(button(value+'×',()=>setRate(value)));panel.append(rates);if(running){scroll.querySelectorAll('input,select,button').forEach(node=>node.disabled=true);select.disabled=true;saveButtons.querySelectorAll('button').forEach(node=>node.disabled=true);runButtons.firstChild.disabled=true;}else runButtons.lastChild.disabled=true;return panel;}
function renderFlowStep(){const content=el('div',{class:'step-content'}),chosen=catalog();chosen.classList.add('wizard-catalog');content.append(chosen);const next=el('div',{class:'wizard-next'}),continueButton=button('继续配置 →',()=>{if(!selectedFlow||running)return;step=2;render();},'primary');continueButton.disabled=!selectedFlow||running;next.append(continueButton);content.append(next);return content;}
function renderConfigurationStep(){const content=el('div',{class:'step-content'});content.append(workspace());return content;}
function renderResultStep(){const content=el('div',{class:'step-content'});if(!selectedFlow){content.append(el('div',{class:'empty'},'请先选择目录中的流程。'));return content;}const profile=profiles[profileIndex];content.append(el('h2',{},selectedFlow.name),el('p',{class:'description'},selectedFlow.sample?'目录容量示意，无可运行配置':profile?'配置：'+profile.name+' · 修订'+profile.revision:'此流程暂无配置'),el('div',{class:'result'},selectedFlow.sample?'此条目仅用于检验分类和搜索。':result));const row=el('div',{class:'wizard-next'});row.append(button('← 返回配置',()=>{if(running)return;step=2;render();}),button('运行示意',run,'primary'));row.firstChild.disabled=running;row.lastChild.disabled=running||fixture||selectedFlow.sample||!profile||profile.readOnly;content.append(row);return content;}
function render(){const main=document.getElementById('main');main.replaceChildren();if(variant==='A'){const layout=el('div',{class:'layout-a'});layout.append(catalog(),workspace());main.append(layout);}if(variant==='B'){const layout=el('div',{class:'layout-b'});layout.append(catalog(true),workspace());main.append(layout);}if(variant==='C'){const layout=el('div',{class:'layout-c'}),steps=el('div',{class:'steps'});['选择流程','调整配置','运行与结果'].forEach((label,index)=>{const control=button((index+1)+' · '+label,()=>{if(running||(index>0&&!selectedFlow))return;step=index+1;render();},step===index+1?'active':'');control.disabled=running||(index>0&&!selectedFlow);steps.append(control);});layout.append(steps,[renderFlowStep,renderConfigurationStep,renderResultStep][step-1]());main.append(layout);}document.getElementById('variant-label').textContent=variant+' · '+names[variant];document.getElementById('density').checked=dense;document.getElementById('fixture').checked=fixture;document.getElementById('density').disabled=running;document.getElementById('fixture').disabled=running;renderFlows();updateState();if(running){main.querySelectorAll('.catalog input,.catalog select,.catalog button,.profile-row select,.steps button').forEach(node=>node.disabled=true);}}
function switchVariant(offset){variant=variants[(variants.indexOf(variant)+offset+3)%3];const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render();}
function setRate(value){rate=value;const button=document.getElementById('rate');button.textContent=rate+'×';const next=rate===1?2:rate===2?.5:1;button.title='点击切换为'+next+'×';if(running&&values.run.target==='current')abort('玩家主动改速，当前局运行示意已中断');}
document.getElementById('rate').onclick=()=>setRate(rate===1?2:rate===2?.5:1);
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▷':'Ⅱ';document.getElementById('calendar-note').textContent=paused?'经营已暂停 · 仍可交易':'自动照料 · 成熟自动入库';};
document.getElementById('previous').onclick=()=>switchVariant(-1);document.getElementById('next').onclick=()=>switchVariant(1);
document.getElementById('density').onchange=e=>{if(running)return;dense=e.target.checked;category='全部';if(selectedFlow&&!flowList().some(flow=>flow.id===selectedFlow.id))selectedFlow=null;render();};document.getElementById('fixture').onchange=e=>{if(running)return;fixture=e.target.checked;feedback='字段兼容示意仅验证公共表单形状，不是可运行流程。';render();};
document.addEventListener('keydown',event=>{if(deleteDialog.open)return;if(event.target.matches('input,textarea,select,[contenteditable]'))return;if(event.key==='ArrowLeft')switchVariant(-1);if(event.key==='ArrowRight')switchVariant(1);});
render();
</script>
</body></html>
